name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            directory: api
            lockfile: api/pnpm-lock.yaml
          - name: Web
            directory: web
            lockfile: web/pnpm-lock.yaml
          - name: Mobile
            directory: mobile
            lockfile: mobile/pnpm-lock.yaml
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mahfil_fund
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_API_URL: https://placeholder.api.example.com

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application quality gate
        run: pnpm check
