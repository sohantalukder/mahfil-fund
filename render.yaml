services:
  - type: web
    name: mahfil-api
    runtime: node
    plan: starter          # change to: free | starter | standard | pro
    region: singapore      # change to: oregon | ohio | frankfurt | singapore
    branch: main
    rootDir: api

    buildCommand: pnpm install --frozen-lockfile && pnpm build

    # Runs migrations before the new version goes live (zero-downtime deploy)
    preDeployCommand: pnpm exec prisma migrate deploy

    startCommand: node dist/server.js

    # Render exposes PORT automatically; Fastify should read process.env.PORT
    healthCheckPath: /health

    autoDeploy: false          # GitHub Actions controls deployments

    envVars:
      - key: NODE_ENV
        value: production

      - key: PNPM_VERSION
        value: "10"

      # Render injects PORT automatically — no need to set it here

      # ── Supabase ─────────────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false            # Set manually in Render dashboard

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: mahfil-uploads

      # ── Database ──────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false            # Use Supabase "Transaction" or "Session" pooler URL

      # ── Authentication and email ─────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: MAILTRAP_HOST
        sync: false

      - key: MAILTRAP_PORT
        value: "2525"

      - key: MAILTRAP_USER
        sync: false

      - key: MAILTRAP_PASS
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: OTP_EXPIRY_MINUTES
        value: "10"

      - key: ADMIN_COMMUNITY_LIMIT
        value: "10"

      # ── CORS ──────────────────────────────────────────────────────────────────
      - key: CORS_ORIGIN
        sync: false            # e.g. https://mahfil.app,https://admin.mahfil.app

      # ── Proxy ─────────────────────────────────────────────────────────────────
      - key: TRUST_PROXY
        value: "true"
